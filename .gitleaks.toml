# gitleaks: the default rules, with one narrow exception.
# Read by ci.yml (gitleaks finds .gitleaks.toml at the root of --source), for the files and for the git history alike.
#
# fixtures/auth.json holds the protocol's golden test vectors (HMAC keys, MIDI codes, session keys): made-up values,
# generated by link-protocol.js, that the three implementations must agree on byte for byte. They are not secrets,
# and the file is JSON, so it cannot carry an inline "gitleaks:allow". Only generic-api-key is waived, and only there.
# Two lines of the Python tests carry an inline "gitleaks:allow" instead.

[extend]
useDefault = true

[[allowlists]]
description = "Golden test vectors of the Link protocol (made-up keys and codes)"
targetRules = ["generic-api-key"]
paths = ['''(?:^|[\/])fixtures[\/]auth\.json$''']

# (19 nov.) uwl-vst3host : heberger un plugin VST3 du commerce (Diva, Kontakt, Vital…) — le module, l'instance (controleur
# a part, messages, etats), le traitement, l'editeur dans une fenetre a nous, et le processus enfant du compagnon
# (uppwind-companion --plug-host / --plug-scan). Partagee par le compagnon et l'hote d'essai (uwl-host).
[package]
name = "uwl-vst3host"
description = "Uppwind Link: hosting a VST3 plugin (module, instance, state, editor window, the companion's child host)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vst3 = "0.3"
serde_json = "1"
sha2 = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Ole", "Win32_System_Com", "Win32_System_ProcessStatus"]

# Copyright (C) 2026 Uppwind
# Uppwind Link -- the macOS companion and its plugins, signed and notarized (called by macos-preview.yml and
# release.yml). The result is a workflow artifact "uppwind-companion-macos" (the .dmg and its SHA-256) and the output
# dmg-sha256; this workflow never publishes a release itself.
#
# (24 Nov 2026, audit M8) Building and signing are separate jobs. Before, the keychain holding the Developer ID
# certificate was open while `cargo build` ran the build scripts of ~400 crates: one compromised crate could have
# signed its own payload. Now:
#
#   1. build-plugins     no secret   tests, notices, the plugins (universal), bundled and NOT signed
#   2. sign-plugins      "release"   codesign the two plugin bundles; no cargo, nothing built is run
#   3. build-companion   no secret   the companion and its helper, embedding the bundles SIGNED in job 2
#   4. sign-notarize     "release"   codesign the companion and the helper, the .dmg, notarytool, stapler; no cargo,
#                                    nothing built is run
#   5. verify            no secret   everything that runs what was built: auval, --license, --install-plugins and
#                                    diff -r, spctl, stapler validate, as a user gets the .dmg
#
# The plugins must be signed BEFORE the companion embeds them (companion/build.rs copies their bytes), hence the
# order. Between jobs the files travel as one tar (upload-artifact drops the executable bits), whose SHA-256 the
# producing job gives as an output and the next job checks before extracting it into an empty folder. The signing
# jobs take the entitlements, the README and the licences from their own checkout, never from an artifact.
# What it does not prevent: a compromised dependency can still alter the plugin or the companion it helps build,
# and that code gets signed. It can no longer sign anything else, nor take the key.
#
# Secrets (in the "release" environment, which waits for Lucas's approval -- twice per run now, once per signing
# job): MACOS_CERT_P12_BASE64 (the .p12 export of the certificate and its key, base64), MACOS_CERT_PASSWORD;
# notarization with an App Store Connect API key (no more Apple ID password): APPLE_API_KEY_P8_BASE64 (the
# AuthKey_<id>.p8 file, base64), APPLE_API_KEY_ID, APPLE_API_ISSUER_ID. The callers pass them with
# `secrets: inherit`; they reach only the steps that use them, never a command line that is printed. The certificate
# lives in a keychain made for each signing job (random password, key not exportable) and deleted at its end,
# whatever happens; the .p8 file too.
name: macos-build

on:
  workflow_call:
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      APPLE_API_KEY_P8_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
    outputs:
      dmg-sha256:
        description: SHA-256 of uppwind-companion-macos.dmg, as signed, notarized and stapled by sign-notarize
        value: ${{ jobs.sign-notarize.outputs.dmg_sha256 }}

permissions:
  contents: read

# (24 Nov, review) an explicit `shell: bash` makes GitHub run `bash --noprofile --norc -eo pipefail {0}`; without it
# the default is `bash -e {0}`, no pipefail. So no pipe here ends in a reader that stops early (grep -q, awk exit,
# head): the output is read once into a variable, then matched with a here-string
defaults:
  run:
    shell: bash

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never
  BUNDLE_ID: com.uppwind.link.companion

jobs:
  # 1. no secret: everything that runs third-party code (cargo, build scripts, tests)
  build-plugins:
    name: "1/5 plugins: tests, build (no signing, no secret)"
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (both Mac targets)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
          rustc -V
          uname -m
          sw_vers
          xcodebuild -version
      # (11 Nov, 0.4.0) the plugins twice: as the VST3 / CLAP, and with the Audio Units (the "auv2" feature, which
      # dev/build-macos.sh builds by default); the companion's tests here too, so that a signing approval is only
      # asked for a build whose tests passed
      - name: Tests
        run: |
          cargo test --release --locked --manifest-path plugin/Cargo.toml
          cargo test --release --locked --manifest-path plugin/Cargo.toml --features uppwind-link/auv2
          cargo test --release --locked --manifest-path companion/Cargo.toml
      # the notices embedded in the program (--license) must list the Mac crates too (option-ext, MPL-2.0…), the
      # companion's and the plugins'
      - name: Third-party notices up to date
        run: |
          cargo fetch --locked --manifest-path companion/Cargo.toml
          cargo fetch --locked --manifest-path plugin/Cargo.toml
          python3 -I dev/third_party_notices.py --check
      # as RELEASING.md step 4: fresh target folders, --locked, the runner's paths remapped with --config (never
      # RUSTFLAGS); UWL_STAGE=plugins stops after the bundles, unsigned
      - name: Build the plugins (universal, release flags, NOT signed)
        run: |
          rm -rf plugin/target
          UWL_RELEASE=1 UWL_STAGE=plugins sh dev/build-macos.sh "$RUNNER_TEMP/build"
          lipo -archs "$RUNNER_TEMP/build/Uppwind Link.vst3/Contents/MacOS/Uppwind Link"
          lipo -archs "$RUNNER_TEMP/build/Uppwind Link.component/Contents/MacOS/Uppwind Link"
          python3 -I dev/release_check.py "$RUNNER_TEMP/build/Uppwind Link.vst3/Contents/MacOS/Uppwind Link" \
            "$RUNNER_TEMP/build/Uppwind Link.component/Contents/MacOS/Uppwind Link"
      - name: Pack (tar, SHA-256 as the job's output)
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/build" -cf "$RUNNER_TEMP/art/plugins-unsigned.tar" "Uppwind Link.vst3" "Uppwind Link.component"
          H=$(shasum -a 256 "$RUNNER_TEMP/art/plugins-unsigned.tar" | awk '{ print $1 }')
          echo "plugins-unsigned.tar: $H"
          echo "sha256=$H" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uwl-mac-plugins-unsigned
          path: ${{ runner.temp }}/art/plugins-unsigned.tar
          if-no-files-found: error
          retention-days: 7

  # 2. the certificate, and only codesign: no checkout, no cargo, nothing of the artifact is run
  sign-plugins:
    name: "2/5 plugins: sign (Developer ID)"
    needs: build-plugins
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uwl-mac-plugins-unsigned
          path: ${{ runner.temp }}/in
      - name: Check the SHA-256 given by job 1, extract into an empty folder
        env:
          WANT: ${{ needs.build-plugins.outputs.sha256 }}
        run: |
          TAR="$RUNNER_TEMP/in/plugins-unsigned.tar"
          grep -Eq '^[0-9a-f]{64}$' <<< "$WANT"
          echo "$WANT  $TAR" | shasum -a 256 -c -
          # exactly the two bundles, nothing outside them (the listing read once: no pipe into grep -q)
          LIST=$(tar -tf "$TAR")
          TOP=$(awk -F/ '{ print $1 }' <<< "$LIST" | sort -u | tr '\n' '|')
          [ "$TOP" = "Uppwind Link.component|Uppwind Link.vst3|" ] || { echo "unexpected entries: $TOP"; exit 1; }
          if grep -Eq '(^/|(^|/)\.\.(/|$))' <<< "$LIST"; then echo "absolute or .. path in the tar"; exit 1; fi
          mkdir "$RUNNER_TEMP/plugins"
          tar -C "$RUNNER_TEMP/plugins" -xf "$TAR"
          ls -la "$RUNNER_TEMP/plugins"
      - name: Temporary keychain with the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/uwl-signing.keychain-db"
          KC_PASS=$(openssl rand -hex 32)
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          umask 077
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/uwl-cert.p12"
          # -x: the private key cannot be exported from the keychain
          security import "$RUNNER_TEMP/uwl-cert.p12" -k "$KEYCHAIN" -f pkcs12 -x -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/uwl-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          # the job's keychain first in the search list, the runner's own ones kept after it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # match the identity by its hash (several "Developer ID Application" names could exist one day)
          IDS=$(security find-identity -v -p codesigning "$KEYCHAIN")
          IDENTITY=$(awk '/"Developer ID Application: / && !f { print $2; f = 1 }' <<< "$IDS")
          if [ -z "$IDENTITY" ]; then
            echo "no valid Developer ID Application identity in the certificate"
            sed -E 's/"[^"]*"/"…"/' <<< "$IDS"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing identity: $IDENTITY"
      # hardened runtime, Apple's timestamp (as dev/build-macos.sh did with UWL_PLUGIN_SIGN_IDENTITY)
      - name: Sign the plugin bundles and check their signature
        run: |
          for k in vst3 component; do
            B="$RUNNER_TEMP/plugins/Uppwind Link.$k"
            codesign --force --options runtime --timestamp --keychain "$RUNNER_TEMP/uwl-signing.keychain-db" --sign "$SIGN_IDENTITY" "$B"
            codesign --verify --deep --strict --verbose=2 "$B"
            INFO=$(codesign -dv --verbose=4 "$B" 2>&1)
            printf '%s\n' "$INFO" | grep -E '^(Identifier|Format|CodeDirectory|Authority|Timestamp|TeamIdentifier|Runtime Version)'
            # a Developer ID signature, timestamped, with the hardened runtime (not ad hoc); here-strings, not pipes
            # into grep -q (pipefail)
            grep -q '^Authority=Developer ID Application: ' <<< "$INFO"
            grep -q '^Timestamp=' <<< "$INFO"
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(runtime\)' <<< "$INFO"
          done
      - name: Pack (tar, SHA-256 as the job's output)
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/plugins" -cf "$RUNNER_TEMP/art/plugins-signed.tar" "Uppwind Link.vst3" "Uppwind Link.component"
          H=$(shasum -a 256 "$RUNNER_TEMP/art/plugins-signed.tar" | awk '{ print $1 }')
          echo "plugins-signed.tar: $H"
          echo "sha256=$H" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uwl-mac-plugins-signed
          path: ${{ runner.temp }}/art/plugins-signed.tar
          if-no-files-found: error
          retention-days: 7
      - name: Delete the keychain and the certificate
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/uwl-cert.p12"
          if [ -f "$RUNNER_TEMP/uwl-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/uwl-signing.keychain-db"
            echo "keychain deleted"
          fi
          security list-keychains -d user

  # 3. no secret: the companion, with the plugins signed in job 2 inside (byte for byte)
  build-companion:
    name: "3/5 companion: build with the signed plugins (no secret)"
    needs: sign-plugins
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (both Mac targets)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
          rustc -V
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uwl-mac-plugins-signed
          path: ${{ runner.temp }}/in
      - name: Check the SHA-256 given by job 2, extract into an empty folder, check the signatures
        env:
          WANT: ${{ needs.sign-plugins.outputs.sha256 }}
        run: |
          TAR="$RUNNER_TEMP/in/plugins-signed.tar"
          grep -Eq '^[0-9a-f]{64}$' <<< "$WANT"
          echo "$WANT  $TAR" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/plugins"
          tar -C "$RUNNER_TEMP/plugins" -xf "$TAR"
          for k in vst3 component; do
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/plugins/Uppwind Link.$k"
            INFO=$(codesign -dv --verbose=4 "$RUNNER_TEMP/plugins/Uppwind Link.$k" 2>&1)
            grep -q '^Authority=Developer ID Application: ' <<< "$INFO"
          done
      # UWL_STAGE=companion builds no plugin: it embeds the two bundles named here (companion/build.rs). The
      # companion and its helper are left unsigned (UWL_NO_ADHOC=1), signed in job 4
      - name: Build the companion (universal, release flags, the signed plugins inside)
        run: |
          rm -rf companion/target
          UWL_RELEASE=1 UWL_NO_ADHOC=1 UWL_STAGE=companion \
            UWL_PLUGIN_BUNDLE="$RUNNER_TEMP/plugins/Uppwind Link.vst3" UWL_PLUGIN_COMPONENT="$RUNNER_TEMP/plugins/Uppwind Link.component" \
            sh dev/build-macos.sh "$RUNNER_TEMP/build"
          lipo -archs "$RUNNER_TEMP/build/uppwind-companion"
          lipo -archs "$RUNNER_TEMP/build/uppwind-link-host"
          python3 -I dev/release_check.py "$RUNNER_TEMP/build/uppwind-companion" "$RUNNER_TEMP/build/uppwind-link-host"
          # the shape job 4 requires of them (a mismatch fails here, before the second approval)
          for f in uppwind-companion uppwind-link-host; do
            KIND=$(file -b "$RUNNER_TEMP/build/$f")
            echo "$f: $KIND"
            case "$KIND" in
              "Mach-O universal binary with 2 architectures"*) ;;
              *) echo "$f is not a universal Mach-O"; exit 1 ;;
            esac
          done
      # before asking for the second approval: an ad hoc signed COPY carries the notices and installs exactly the
      # signed bundles (job 5 checks it all again on the .dmg)
      - name: Early check (an ad hoc copy installs exactly the signed plugins)
        run: |
          mkdir "$RUNNER_TEMP/try"
          ditto "$RUNNER_TEMP/build/uppwind-companion" "$RUNNER_TEMP/try/uppwind-companion"
          codesign --force --sign - "$RUNNER_TEMP/try/uppwind-companion"
          "$RUNNER_TEMP/try/uppwind-companion" --license > "$RUNNER_TEMP/license.txt"
          grep -q "Uppwind Link plugins -- third-party notices" "$RUNNER_TEMP/license.txt"
          grep -q "AudioUnitSDK" "$RUNNER_TEMP/license.txt"
          "$RUNNER_TEMP/try/uppwind-companion" --install-plugins --plugins-dir "$RUNNER_TEMP/vst3-check"
          for k in vst3 component; do
            diff -r "$RUNNER_TEMP/plugins/Uppwind Link.$k" "$RUNNER_TEMP/vst3-check/Uppwind Link.$k"
          done
          rm -rf "$RUNNER_TEMP/try" "$RUNNER_TEMP/vst3-check"
      - name: Pack (tar, SHA-256 as the job's output)
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/build" -cf "$RUNNER_TEMP/art/companion-unsigned.tar" uppwind-companion uppwind-link-host
          H=$(shasum -a 256 "$RUNNER_TEMP/art/companion-unsigned.tar" | awk '{ print $1 }')
          echo "companion-unsigned.tar: $H"
          echo "sha256=$H" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uwl-mac-companion-unsigned
          path: ${{ runner.temp }}/art/companion-unsigned.tar
          if-no-files-found: error
          retention-days: 7

  # 4. the certificate and the API key, and only codesign, hdiutil, notarytool, stapler: no cargo, nothing of the
  # artifacts is run. The checkout gives the entitlements, the README, the licences and the notices (never an artifact)
  sign-notarize:
    name: "4/5 companion: sign, .dmg, notarize, staple"
    needs: [sign-plugins, build-companion]
    environment: release
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      dmg_sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uwl-mac-plugins-signed
          path: ${{ runner.temp }}/in-plugins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uwl-mac-companion-unsigned
          path: ${{ runner.temp }}/in-companion
      # the plugins from job 2 itself (not a copy passed on by job 3, which ran cargo)
      - name: Check the SHA-256 given by jobs 2 and 3, extract into empty folders
        env:
          WANT_PLUGINS: ${{ needs.sign-plugins.outputs.sha256 }}
          WANT_COMPANION: ${{ needs.build-companion.outputs.sha256 }}
        run: |
          P="$RUNNER_TEMP/in-plugins/plugins-signed.tar"
          C="$RUNNER_TEMP/in-companion/companion-unsigned.tar"
          grep -Eq '^[0-9a-f]{64}$' <<< "$WANT_PLUGINS"
          grep -Eq '^[0-9a-f]{64}$' <<< "$WANT_COMPANION"
          echo "$WANT_PLUGINS  $P" | shasum -a 256 -c -
          echo "$WANT_COMPANION  $C" | shasum -a 256 -c -
          TOP=$(tar -tf "$C" | sort | tr '\n' '|')
          [ "$TOP" = "uppwind-companion|uppwind-link-host|" ] || { echo "unexpected entries: $TOP"; exit 1; }
          mkdir "$RUNNER_TEMP/build"
          tar -C "$RUNNER_TEMP/build" -xf "$P"
          # (24 Nov, review) job 3 ran cargo: its tar goes into a folder of its own, and must give two plain files
          # (no symbolic link, no hard link, no folder), both universal Mach-O, before they join the signed plugins.
          # Else a link "uppwind-companion -> Uppwind Link.vst3/..." would have codesign sign a plugin's binary as
          # the companion
          mkdir "$RUNNER_TEMP/companion-in"
          tar -C "$RUNNER_TEMP/companion-in" -xf "$C"
          for f in uppwind-companion uppwind-link-host; do
            F="$RUNNER_TEMP/companion-in/$f"
            if [ -L "$F" ] || [ ! -f "$F" ]; then echo "$f is not a plain file"; exit 1; fi
            [ "$(stat -f %l "$F")" = "1" ] || { echo "$f has other hard links"; exit 1; }
            KIND=$(file -b "$F")
            echo "$f: $KIND"
            case "$KIND" in
              "Mach-O universal binary with 2 architectures"*) ;;
              *) echo "$f is not a universal Mach-O"; exit 1 ;;
            esac
            mv "$F" "$RUNNER_TEMP/build/$f"
          done
          ls -la "$RUNNER_TEMP/build"
          for k in vst3 component; do
            INFO=$(codesign -dv --verbose=4 "$RUNNER_TEMP/build/Uppwind Link.$k" 2>&1)
            codesign --verify --deep --strict "$RUNNER_TEMP/build/Uppwind Link.$k"
            grep -q '^Authority=Developer ID Application: ' <<< "$INFO"
          done
      - name: Temporary keychain with the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/uwl-signing.keychain-db"
          KC_PASS=$(openssl rand -hex 32)
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          umask 077
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/uwl-cert.p12"
          # -x: the private key cannot be exported from the keychain
          security import "$RUNNER_TEMP/uwl-cert.p12" -k "$KEYCHAIN" -f pkcs12 -x -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/uwl-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDS=$(security find-identity -v -p codesigning "$KEYCHAIN")
          IDENTITY=$(awk '/"Developer ID Application: / && !f { print $2; f = 1 }' <<< "$IDS")
          if [ -z "$IDENTITY" ]; then
            echo "no valid Developer ID Application identity in the certificate"
            sed -E 's/"[^"]*"/"…"/' <<< "$IDS"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing identity: $IDENTITY"
      # hardened runtime, Apple's timestamp, a stable identifier (the one of the LaunchAgent), no entitlements: the
      # companion needs neither JIT (WKWebView runs its JavaScript in WebKit's own processes) nor get-task-allow, and
      # it loads only Apple's frameworks. All the checks here read the signatures; none runs the programs (job 5)
      - name: Sign the companion and the helper
        run: |
          KEYCHAIN="$RUNNER_TEMP/uwl-signing.keychain-db"
          BIN="$RUNNER_TEMP/build/uppwind-companion"
          codesign --force --options runtime --timestamp --identifier "$BUNDLE_ID" --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dv --verbose=4 "$BIN" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Authority|Timestamp|TeamIdentifier|Runtime Version)'
          echo "entitlements (none expected):"
          codesign -d --entitlements - "$BIN" 2>&1 || true
          # (20 Nov 2026) uppwind-link-host, the only program that loads other makers' VST 3 plugins: the hardened
          # runtime too, with ONE entitlement (dev/host-entitlements.plist, from this job's checkout:
          # disable-library-validation, which every DAW has); the companion above keeps none
          HOST="$RUNNER_TEMP/build/uppwind-link-host"
          codesign --force --options runtime --timestamp --identifier "$BUNDLE_ID.host" --entitlements dev/host-entitlements.plist --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$HOST"
          codesign --verify --strict --verbose=2 "$HOST"
          # exactly one entitlement on the helper, the hardened runtime on both, none on the companion
          codesign -d --entitlements - --xml "$HOST" 2>/dev/null > "$RUNNER_TEMP/host-ent.plist"
          python3 -I -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); k=sorted(d); print("helper entitlements:", k); sys.exit(0 if k==["com.apple.security.cs.disable-library-validation"] and d[k[0]] is True else 1)' "$RUNNER_TEMP/host-ent.plist"
          for P in "$HOST" "$BIN"; do
            INFO=$(codesign -dv "$P" 2>&1)
            grep -qE 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$INFO"
          done
          if [ -n "$(codesign -d --entitlements - --xml "$BIN" 2>/dev/null)" ]; then
            echo "the companion must carry no entitlement"; exit 1
          fi
      # the signed Uppwind Link.vst3 and Uppwind Link.component too: notarization covers them, and a user can drag them
      # into ~/Library/Audio/Plug-Ins/VST3 and ~/Library/Audio/Plug-Ins/Components
      - name: The .dmg (the companion, the plugins, README, licences, notices)
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" dist
          mkdir -p "$STAGE" dist
          ditto "$RUNNER_TEMP/build/uppwind-companion" "$STAGE/uppwind-companion"
          ditto "$RUNNER_TEMP/build/uppwind-link-host" "$STAGE/uppwind-link-host"
          for k in vst3 component; do
            ditto "$RUNNER_TEMP/build/Uppwind Link.$k" "$STAGE/Uppwind Link.$k"
            codesign --verify --deep --strict "$STAGE/Uppwind Link.$k"
          done
          cp README.md LICENSE LICENSE-EXCEPTION.txt LICENSE-EXCEPTION-PLUGINS.txt LICENSE-EXCEPTION-HOST.txt LICENSE-MIT THIRD-PARTY-NOTICES.txt "$STAGE/"
          cp plugin/THIRD-PARTY-NOTICES.txt "$STAGE/THIRD-PARTY-NOTICES-PLUGINS.txt"
          ok=0
          for i in 1 2 3; do
            if hdiutil create -volname "Uppwind Link" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov dist/uppwind-companion-macos.dmg; then ok=1; break; fi
            echo "hdiutil create failed (try $i), again in 10 s"
            sleep 10
          done
          [ "$ok" = "1" ]
          codesign --force --timestamp --identifier "$BUNDLE_ID.dmg" --keychain "$RUNNER_TEMP/uwl-signing.keychain-db" --sign "$SIGN_IDENTITY" dist/uppwind-companion-macos.dmg
          codesign --verify --strict --verbose=2 dist/uppwind-companion-macos.dmg
      # (24 Nov, audit M8) an App Store Connect API key (a Team key, least access, see RELEASING.md), no more Apple ID and
      # app-specific password: it can be revoked alone, and it opens nothing else of the Apple account
      - name: Notarize (notarytool with an App Store Connect API key, waits for Apple)
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # a value pasted with a newline or spaces around it is refused by Apple: trim them
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'; }
          APPLE_API_KEY_ID=$(trim "$APPLE_API_KEY_ID")
          APPLE_API_ISSUER_ID=$(trim "$APPLE_API_ISSUER_ID")
          KEY="$RUNNER_TEMP/uwl-notary-key.p8"
          umask 077
          # base64 of the .p8 file (with or without line breaks)
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY"
          # the shape of the secrets (yes/no only, never a value)
          yn() { if grep -Eq "$1" <<< "$2"; then echo yes; else echo no; fi; }
          echo "APPLE_API_KEY_ID is 10 capitals/digits: $(yn '^[A-Z0-9]{10}$' "$APPLE_API_KEY_ID")"
          echo "APPLE_API_ISSUER_ID is a UUID: $(yn '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' "$APPLE_API_ISSUER_ID")"
          if [ "$(head -n 1 "$KEY")" = "-----BEGIN PRIVATE KEY-----" ]; then echo "the .p8 is a private key: yes"; else echo "the .p8 is a private key: no"; fi
          set +e
          xcrun notarytool submit dist/uppwind-companion-macos.dmg --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/notary.json"
          echo
          SUB_ID=""
          STATUS=""
          if [ -s "$RUNNER_TEMP/notary.json" ]; then
            SUB_ID=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notary.json" || true)
            STATUS=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notary.json" || true)
          fi
          echo "notarization: id=$SUB_ID status=$STATUS (exit $rc)"
          if [ -n "$SUB_ID" ]; then
            xcrun notarytool log "$SUB_ID" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
          fi
          rm -f "$KEY"
          [ "$STATUS" = "Accepted" ]
      - name: Staple
        run: |
          xcrun stapler staple dist/uppwind-companion-macos.dmg
          xcrun stapler validate dist/uppwind-companion-macos.dmg
      - name: SHA-256 (the job's output, checked by job 5 and by release.yml)
        id: sha
        run: |
          cd dist
          shasum -a 256 uppwind-companion-macos.dmg > uppwind-companion-macos.dmg.sha256
          cat uppwind-companion-macos.dmg.sha256
          echo "sha256=$(awk '{ print $1 }' uppwind-companion-macos.dmg.sha256)" >> "$GITHUB_OUTPUT"
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uppwind-companion-macos
          path: |
            dist/uppwind-companion-macos.dmg
            dist/uppwind-companion-macos.dmg.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Delete the keychain, the certificate and the API key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/uwl-cert.p12" "$RUNNER_TEMP/uwl-notary-key.p8"
          if [ -f "$RUNNER_TEMP/uwl-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/uwl-signing.keychain-db"
            echo "keychain deleted"
          fi
          security list-keychains -d user

  # 5. no secret: the .dmg as a user gets it, and everything that runs the programs and the plugins
  verify:
    name: "5/5 check the .dmg like a user (Gatekeeper, auval, the plugins it installs)"
    needs: sign-notarize
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uppwind-companion-macos
          path: dist
      - name: Check the SHA-256 given by job 4
        env:
          WANT: ${{ needs.sign-notarize.outputs.dmg_sha256 }}
        run: |
          grep -Eq '^[0-9a-f]{64}$' <<< "$WANT"
          echo "$WANT  dist/uppwind-companion-macos.dmg" | shasum -a 256 -c -
          [ "$(awk '{ print $1 }' dist/uppwind-companion-macos.dmg.sha256)" = "$WANT" ]
      - name: Gatekeeper, signatures, the programs and the plugins of the .dmg
        run: |
          DMG=dist/uppwind-companion-macos.dmg
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          spctl -a -vvv -t install "$DMG" || echo "(spctl -t install: see above)"
          MNT="$RUNNER_TEMP/mnt"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          BIN="$MNT/uppwind-companion"
          HOST="$MNT/uppwind-link-host"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --verify --strict --verbose=2 "$HOST"
          for P in "$BIN" "$HOST"; do
            INFO=$(codesign -dv --verbose=4 "$P" 2>&1)
            printf '%s\n' "$INFO" | grep -E '^(Identifier|Authority|Timestamp|TeamIdentifier)'
            grep -q '^Authority=Developer ID Application: ' <<< "$INFO"
            grep -q '^Timestamp=' <<< "$INFO"
            grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$INFO"
          done
          # the companion without any entitlement, the helper with disable-library-validation only
          if [ -n "$(codesign -d --entitlements - --xml "$BIN" 2>/dev/null)" ]; then
            echo "the companion must carry no entitlement"; exit 1
          fi
          codesign -d --entitlements - --xml "$HOST" 2>/dev/null > "$RUNNER_TEMP/host-ent.plist"
          python3 -I -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); k=sorted(d); print("helper entitlements:", k); sys.exit(0 if k==["com.apple.security.cs.disable-library-validation"] and d[k[0]] is True else 1)' "$RUNNER_TEMP/host-ent.plist"
          spctl -a -vvv -t exec "$BIN" || echo "(spctl -t exec on a bare executable: see above)"
          "$BIN" --license > "$RUNNER_TEMP/license-dmg.txt"
          head -n 3 "$RUNNER_TEMP/license-dmg.txt"
          grep -q "option-ext" "$RUNNER_TEMP/license-dmg.txt"
          grep -q "Uppwind Link plugins -- third-party notices" "$RUNNER_TEMP/license-dmg.txt"
          grep -q "AudioUnitSDK" "$RUNNER_TEMP/license-dmg.txt"
          # the plugins in the .dmg: the Developer ID signature, valid; Gatekeeper's view of a plugin bundle
          for k in vst3 component; do
            codesign --verify --deep --strict --verbose=2 "$MNT/Uppwind Link.$k"
            INFO=$(codesign -dv --verbose=4 "$MNT/Uppwind Link.$k" 2>&1)
            printf '%s\n' "$INFO" | grep -E '^(Authority|TeamIdentifier|Timestamp)'
            grep -q '^Authority=Developer ID Application: ' <<< "$INFO"
            grep -q '^Timestamp=' <<< "$INFO"
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(runtime\)' <<< "$INFO"
            spctl -a -vvv -t install "$MNT/Uppwind Link.$k" || echo "(spctl -t install on a plugin bundle: see above)"
          done
          # and the companion of the .dmg installs those very bundles (into a folder of the runner)
          "$BIN" --install-plugins --plugins-dir "$RUNNER_TEMP/vst3-dmg"
          for k in vst3 component; do
            diff -r "$MNT/Uppwind Link.$k" "$RUNNER_TEMP/vst3-dmg/Uppwind Link.$k"
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/vst3-dmg/Uppwind Link.$k"
          done
          mkdir -p "$RUNNER_TEMP/component"
          ditto "$MNT/Uppwind Link.component" "$RUNNER_TEMP/component/Uppwind Link.component"
          hdiutil detach "$MNT"
      # (11 Nov, 0.4.0) Logic Pro refuses an Audio Unit that fails auval: the three of the signed .component of the
      # .dmg (Return, an effect; Notes, an instrument and a MIDI effect) are validated here, from this runner's own
      # Components folder (the runner is thrown away after the job). Never auval -a: it scans every Audio Unit.
      - name: auval (the Audio Units of the .dmg, as Logic Pro checks them)
        run: |
          COMP="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$COMP"
          rm -rf "$COMP/Uppwind Link.component"
          ditto "$RUNNER_TEMP/component/Uppwind Link.component" "$COMP/Uppwind Link.component"
          # the registry of Audio Units reads the folder again
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for AU in "aufx UwRt Uppw" "aumu UwNt Uppw" "aumi UwNm Uppw"; do
            echo "auval -v $AU"
            # (AU: three words, so unquoted)
            auval -v $AU > "$RUNNER_TEMP/auval.txt" 2>&1 || true
            tail -n 3 "$RUNNER_TEMP/auval.txt"
            if ! grep -q "AU VALIDATION SUCCEEDED" "$RUNNER_TEMP/auval.txt"; then
              cat "$RUNNER_TEMP/auval.txt"
              exit 1
            fi
          done
          rm -rf "$COMP/Uppwind Link.component"

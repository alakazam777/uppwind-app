# Copyright (C) 2026 Uppwind
# Uppwind Link -- the macOS companion and its plugins, signed and notarized (called by macos-preview.yml and
# release.yml): the Uppwind Link plugins first (Uppwind Link.vst3, universal), signed with the Developer ID
# Application certificate (hardened runtime, Apple's timestamp), then the companion (universal, arm64 + x86_64, lipo),
# built with the release flags and that signed bundle inside (it installs it itself, byte for byte), signed the same
# way (no entitlements); both put in a .dmg with the README, the licences and the notices, the .dmg signed, notarized
# by Apple (notarytool, which covers the bundle too) and stapled. The result is a workflow artifact
# "uppwind-companion-macos" (the .dmg and its SHA-256); this workflow never publishes a release itself.
#
# Secrets (repository secrets, passed by the caller): MACOS_CERT_P12_BASE64 (the .p12 export of the certificate and
# its key, base64), MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password).
# They reach only the steps that use them, never a command line that is printed; the certificate lives in a
# keychain made for this job (random password) and deleted at the end, whatever happens.
name: macos-build

on:
  workflow_call:
    secrets:
      MACOS_CERT_P12_BASE64:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_APP_PASSWORD:
        required: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never
  BUNDLE_ID: com.uppwind.link.companion

jobs:
  macos:
    name: macOS companion (universal, Developer ID, notarized)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (both Mac targets)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
          rustc -V
          uname -m
          sw_vers
          xcodebuild -version
      - name: Tests
        run: |
          cargo test --release --locked --manifest-path plugin/Cargo.toml
          cargo test --release --locked --manifest-path companion/Cargo.toml
      # the notices embedded in the program (--license) must list the Mac crates too (option-ext, MPL-2.0…), the
      # companion's and the plugins'
      - name: Third-party notices up to date
        run: |
          cargo fetch --locked --manifest-path companion/Cargo.toml
          cargo fetch --locked --manifest-path plugin/Cargo.toml
          python3 -I dev/third_party_notices.py --check
      - name: Temporary keychain with the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/uwl-signing.keychain-db"
          KC_PASS=$(openssl rand -hex 32)
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          umask 077
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/uwl-cert.p12"
          security import "$RUNNER_TEMP/uwl-cert.p12" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/uwl-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          # the job's keychain first in the search list, the runner's own ones kept after it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # match the identity by its hash (several "Developer ID Application" names could exist one day)
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application: / { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "no valid Developer ID Application identity in the certificate"
            security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/"[^"]*"/"…"/'
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing identity: $IDENTITY"
      # as RELEASING.md step 4 for Windows: fresh target folders, --locked, the paths of the runner remapped with
      # --config (never RUSTFLAGS). dev/build-macos.sh builds the plugins first and signs their bundles with the
      # Developer ID (hardened runtime, Apple's timestamp), THEN the companion, which embeds that signed bundle; the
      # companion itself is left unsigned here (signed below)
      - name: Build (universal, release flags; the plugins signed before the companion embeds them)
        run: |
          rm -rf companion/target plugin/target
          UWL_RELEASE=1 UWL_NO_ADHOC=1 UWL_PLUGIN_SIGN_IDENTITY="$SIGN_IDENTITY" UWL_SIGN_KEYCHAIN="$RUNNER_TEMP/uwl-signing.keychain-db" \
            sh dev/build-macos.sh "$RUNNER_TEMP/build"
          lipo -archs "$RUNNER_TEMP/build/uppwind-companion"
          lipo -archs "$RUNNER_TEMP/build/Uppwind Link.vst3/Contents/MacOS/Uppwind Link"
      - name: Check the programs (no path of the runner) and the plugins' signature
        run: |
          python3 -I dev/release_check.py "$RUNNER_TEMP/build/uppwind-companion" "$RUNNER_TEMP/build/Uppwind Link.vst3/Contents/MacOS/Uppwind Link"
          VST3="$RUNNER_TEMP/build/Uppwind Link.vst3"
          codesign --verify --deep --strict --verbose=2 "$VST3"
          INFO=$(codesign -dv --verbose=4 "$VST3" 2>&1)
          printf '%s\n' "$INFO" | grep -E '^(Identifier|Format|CodeDirectory|Authority|Timestamp|TeamIdentifier|Runtime Version)'
          # a Developer ID signature, timestamped, with the hardened runtime (not ad hoc); here-strings, not pipes
          # into grep -q (pipefail)
          grep -q '^Authority=Developer ID Application: ' <<< "$INFO"
          grep -q '^Timestamp=' <<< "$INFO"
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(runtime\)' <<< "$INFO"
      # hardened runtime, Apple's timestamp, a stable identifier (the one of the LaunchAgent), no entitlements: the
      # companion needs neither JIT (WKWebView runs its JavaScript in WebKit's own processes) nor get-task-allow, and
      # it loads only Apple's frameworks
      - name: Sign the companion
        run: |
          KEYCHAIN="$RUNNER_TEMP/uwl-signing.keychain-db"
          BIN="$RUNNER_TEMP/build/uppwind-companion"
          codesign --force --options runtime --timestamp --identifier "$BUNDLE_ID" --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dv --verbose=4 "$BIN" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Authority|Timestamp|TeamIdentifier|Runtime Version)'
          echo "entitlements (none expected):"
          codesign -d --entitlements - "$BIN" 2>&1 || true
          "$BIN" --license > "$RUNNER_TEMP/license.txt"
          head -n 3 "$RUNNER_TEMP/license.txt"
          grep -q "Uppwind Link plugins -- third-party notices" "$RUNNER_TEMP/license.txt"
          # the companion carries exactly the signed bundle: installed into a folder of the runner, same bytes, valid
          "$BIN" --install-plugins --plugins-dir "$RUNNER_TEMP/vst3-check"
          diff -r "$RUNNER_TEMP/build/Uppwind Link.vst3" "$RUNNER_TEMP/vst3-check/Uppwind Link.vst3"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/vst3-check/Uppwind Link.vst3"
          rm -rf "$RUNNER_TEMP/vst3-check"
      # the signed Uppwind Link.vst3 too: notarization covers it, and a user can drag it into ~/Library/Audio/Plug-Ins/VST3
      - name: The .dmg (the companion, the plugins, README, licences, notices)
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" dist
          mkdir -p "$STAGE" dist
          ditto "$RUNNER_TEMP/build/uppwind-companion" "$STAGE/uppwind-companion"
          ditto "$RUNNER_TEMP/build/Uppwind Link.vst3" "$STAGE/Uppwind Link.vst3"
          codesign --verify --deep --strict "$STAGE/Uppwind Link.vst3"
          cp README.md LICENSE LICENSE-EXCEPTION.txt LICENSE-EXCEPTION-PLUGINS.txt LICENSE-MIT THIRD-PARTY-NOTICES.txt "$STAGE/"
          cp plugin/THIRD-PARTY-NOTICES.txt "$STAGE/THIRD-PARTY-NOTICES-PLUGINS.txt"
          ok=0
          for i in 1 2 3; do
            if hdiutil create -volname "Uppwind Link" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov dist/uppwind-companion-macos.dmg; then ok=1; break; fi
            echo "hdiutil create failed (try $i), again in 10 s"
            sleep 10
          done
          [ "$ok" = "1" ]
          codesign --force --timestamp --identifier "$BUNDLE_ID.dmg" --keychain "$RUNNER_TEMP/uwl-signing.keychain-db" --sign "$SIGN_IDENTITY" dist/uppwind-companion-macos.dmg
          codesign --verify --strict --verbose=2 dist/uppwind-companion-macos.dmg
      - name: Notarize (notarytool, waits for Apple)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # a value pasted with a newline or spaces around it is refused by Apple (HTTP 401): trim them
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'; }
          APPLE_ID=$(trim "$APPLE_ID")
          APPLE_TEAM_ID=$(trim "$APPLE_TEAM_ID")
          APPLE_APP_PASSWORD=$(trim "$APPLE_APP_PASSWORD")
          # the shape of the secrets (yes/no only, never a value)
          yn() { if printf '%s' "$2" | grep -Eq "$1"; then echo yes; else echo no; fi; }
          echo "APPLE_ID looks like an e-mail address: $(yn '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$' "$APPLE_ID")"
          echo "APPLE_TEAM_ID is 10 capitals/digits: $(yn '^[A-Z0-9]{10}$' "$APPLE_TEAM_ID")"
          echo "APPLE_APP_PASSWORD is xxxx-xxxx-xxxx-xxxx: $(yn '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$' "$APPLE_APP_PASSWORD")"
          set +e
          xcrun notarytool submit dist/uppwind-companion-macos.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/notary.json"
          echo
          SUB_ID=""
          STATUS=""
          if [ -s "$RUNNER_TEMP/notary.json" ]; then
            SUB_ID=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notary.json" || true)
            STATUS=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notary.json" || true)
          fi
          echo "notarization: id=$SUB_ID status=$STATUS (exit $rc)"
          if [ -n "$SUB_ID" ]; then
            xcrun notarytool log "$SUB_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
          fi
          [ "$STATUS" = "Accepted" ]
      - name: Staple and check like a user (Gatekeeper)
        run: |
          DMG=dist/uppwind-companion-macos.dmg
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          spctl -a -vvv -t install "$DMG" || echo "(spctl -t install: see above)"
          MNT="$RUNNER_TEMP/mnt"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          codesign --verify --strict --verbose=2 "$MNT/uppwind-companion"
          spctl -a -vvv -t exec "$MNT/uppwind-companion" || echo "(spctl -t exec on a bare executable: see above)"
          "$MNT/uppwind-companion" --license > "$RUNNER_TEMP/license-dmg.txt"
          head -n 3 "$RUNNER_TEMP/license-dmg.txt"
          grep -q "option-ext" "$RUNNER_TEMP/license-dmg.txt"
          # the plugins in the .dmg: the Developer ID signature, valid; Gatekeeper's view of a plugin bundle
          codesign --verify --deep --strict --verbose=2 "$MNT/Uppwind Link.vst3"
          codesign -dv --verbose=4 "$MNT/Uppwind Link.vst3" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)'
          spctl -a -vvv -t install "$MNT/Uppwind Link.vst3" || echo "(spctl -t install on a plugin bundle: see above)"
          # and the companion of the .dmg installs that very bundle (into a folder of the runner)
          "$MNT/uppwind-companion" --install-plugins --plugins-dir "$RUNNER_TEMP/vst3-dmg"
          diff -r "$MNT/Uppwind Link.vst3" "$RUNNER_TEMP/vst3-dmg/Uppwind Link.vst3"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/vst3-dmg/Uppwind Link.vst3"
          hdiutil detach "$MNT"
      - name: SHA-256
        run: |
          cd dist
          shasum -a 256 uppwind-companion-macos.dmg > uppwind-companion-macos.dmg.sha256
          cat uppwind-companion-macos.dmg.sha256
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uppwind-companion-macos
          path: |
            dist/uppwind-companion-macos.dmg
            dist/uppwind-companion-macos.dmg.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Delete the keychain and the certificate
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/uwl-cert.p12"
          if [ -f "$RUNNER_TEMP/uwl-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/uwl-signing.keychain-db"
            echo "keychain deleted"
          fi
          security list-keychains -d user

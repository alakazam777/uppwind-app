# Copyright (C) 2026 Uppwind
# Uppwind Link -- a release, on a tag v*: builds the Uppwind Link plugins, then uppwind-companion.exe with the plugins
# inside, exactly as RELEASING.md step 4 says, checks both (step 5), attests the provenance and makes a DRAFT release
# with ONLY the exe and SHA256SUMS (never a .pdb or target/). The plugins are not a separate download: the companion
# installs them. (24 Nov, audit E2) The draft is not published here: Lucas downloads SHA256SUMS, checks it, signs it
# offline with the update key (minisign), adds SHA256SUMS.minisig and publishes the draft (RELEASING.md, step 8).
# Companions from 0.4.16 on refuse a release without that signature. The key never comes near GitHub.
# macOS (uppwind-companion-macos.dmg: signed with the Developer ID, notarized, stapled, macos-build.yml) joins the
# release only when the repository variable MACOS_RELEASE is 1 (off by default: the Mac build has to pass a test in a
# real DAW first; macos-preview.yml makes the same .dmg as a workflow artifact, without a release).
# (24 Nov 2026) cargo audit and cargo deny run again here, on the day of the release (a RustSec advisory published
# since the last green ci run stops it); the macOS build waits for them, so no signing approval is asked for a release
# that would be refused.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: Windows build
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      rustc: ${{ steps.toolchain.outputs.rustc }}
      update_keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        id: toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          $rustc = (rustc -V)
          $rustc
          "rustc=$rustc" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: The tag matches the companion's version
        run: |
          $line = Select-String -Path companion/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME but companion/Cargo.toml says $version" }
          "version $version"
      - name: Tests
        run: |
          cargo test --release --locked --manifest-path plugin/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --release --locked --manifest-path companion/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I tests/test_protocol.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I tests/test_fl_script.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I tests/test_ableton.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the notices list the macOS crates too: fetch the crates of every target first (the companion's, the plugins')
          cargo fetch --locked --manifest-path companion/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo fetch --locked --manifest-path plugin/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I dev/third_party_notices.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # RELEASING.md step 4: from the repository folder (.cargo/config.toml applies), the path remapping added with
      # --config (never RUSTFLAGS), fresh target folders, --locked: the plugins first, bundled, then the companion,
      # which embeds that bundle (UWL_PLUGIN_BUNDLE; companion/build.rs refuses any other layout)
      - name: Build (RELEASING.md step 4)
        run: |
          if ($env:CARGO_HOME) { $cargoHome = $env:CARGO_HOME } else { $cargoHome = Join-Path $env:USERPROFILE '.cargo' }
          $src = $env:GITHUB_WORKSPACE
          foreach ($t in @('plugin/target', 'companion/target')) { if (Test-Path $t) { Remove-Item -Recurse -Force $t } }
          "CARGO_HOME=$cargoHome"
          "checkout folder=$src"
          $remap = "target.x86_64-pc-windows-msvc.rustflags=['--remap-path-prefix=$cargoHome=/cargo', '--remap-path-prefix=$src=/src']"
          cargo --config $remap build --release --locked --manifest-path plugin/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & ./plugin/target/release/uwl-bundle.exe --out plugin/target/release/bundled
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # /Brepro writes a hash where the build date goes (0.4.15 claimed 2091): the commit date instead, in the DLL
          # before the companion embeds it, then in the companion (same tag, same date, same bytes)
          $env:SOURCE_DATE_EPOCH = (git log -1 --format=%ct)
          python -I dev/pe_timestamp.py 'plugin/target/release/bundled/Uppwind Link.vst3/Contents/x86_64-win/Uppwind Link.vst3'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:UWL_PLUGIN_BUNDLE = Join-Path $src 'plugin\target\release\bundled\Uppwind Link.vst3'
          "UWL_PLUGIN_BUNDLE=$env:UWL_PLUGIN_BUNDLE"
          cargo --config $remap build --release --locked --manifest-path companion/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I dev/pe_timestamp.py companion/target/release/uppwind-companion.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # the plugins' DLL (the .vst3 of the bundle) and the program: no path of the runner, System32 DLLs only, the C
      # runtime inside, reproducible; then the program installs exactly that DLL (into a folder of the runner, never
      # Program Files, no administrator prompt)
      - name: Check the plugins and the program (RELEASING.md step 5)
        run: |
          $dll = 'plugin/target/release/bundled/Uppwind Link.vst3/Contents/x86_64-win/Uppwind Link.vst3'
          python -I dev/release_check.py $dll companion/target/release/uppwind-companion.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $vst3 = Join-Path $env:RUNNER_TEMP 'vst3-check'
          & ./companion/target/release/uppwind-companion.exe --install-plugins --plugins-dir $vst3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $want = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          $got = (Get-FileHash -Algorithm SHA256 (Join-Path $vst3 'Uppwind Link.vst3\Contents\x86_64-win\Uppwind Link.vst3')).Hash.ToLowerInvariant()
          if ($want -ne $got) { throw "the companion installs $got, the checked plugins are $want" }
          "plugins inside the companion: SHA-256 $want"
      # (24 Nov, audit E2) a companion that knows no update key would refuse every update after it: never released
      # (and they go to the release notes from here: the job that publishes never runs the program)
      - name: The update keys are set
        id: keys
        run: |
          $keys = @(& ./companion/target/release/uppwind-companion.exe --update-keys | ForEach-Object { ($_ -split ': ', 2)[1] })
          if ($LASTEXITCODE -ne 0 -or $keys.Count -eq 0) { throw "update::UPDATE_KEYS: no publishable update key in this build (RELEASING.md, The update keys)" }
          $keys
          "keys=$($keys -join ' ')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uppwind-companion-windows
          path: companion/target/release/uppwind-companion.exe
          if-no-files-found: error
          retention-days: 7

  # the same checks as ci.yml's supply-chain job, same pinned versions (update them together)
  supply-chain:
    name: Dependencies (cargo audit, cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install cargo-audit and cargo-deny (pinned, from crates.io, with their own Cargo.lock)
        run: |
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      # the two ignored advisories: Linux-only crates, see ci.yml
      - name: cargo audit
        run: |
          cargo audit --deny warnings --file companion/Cargo.lock --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370
          cargo audit --deny warnings --file plugin/Cargo.lock
      - name: cargo deny
        run: |
          cargo deny --manifest-path companion/Cargo.toml --config deny.toml check advisories bans licenses sources
          cargo deny --manifest-path plugin/Cargo.toml --config deny.toml check advisories bans licenses sources

  macos:
    name: macOS build (only with MACOS_RELEASE=1)
    # (24 Nov) after the audit AND the Windows build: no approval asked, no .dmg signed and notarized, for a release
    # that will not be published (about an hour later than before)
    needs: [supply-chain, windows]
    if: ${{ vars.MACOS_RELEASE == '1' }}
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
    # (13 Nov) inherit: without it a called workflow gets no secret at all, not even
    # those of the "release" environment its job names (they reached it empty).
    secrets: inherit

  release:
    name: Publish the release
    needs: [windows, supply-chain, macos]
    # the Mac job is skipped unless MACOS_RELEASE=1; when it runs, it must succeed. supply-chain must succeed: a
    # failed audit also skips the Mac job, which this condition alone would accept
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.supply-chain.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uppwind-companion-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.macos.result == 'success' }}
        with:
          name: uppwind-companion-macos
          path: dist-macos
      - name: The files of the release
        env:
          WITH_MACOS: ${{ needs.macos.result == 'success' }}
          MACOS_DMG_SHA256: ${{ needs.macos.outputs.dmg-sha256 }}
        run: |
          $files = @('uppwind-companion.exe')
          if ($env:WITH_MACOS -eq 'true') {
            # (24 Nov) the SHA-256 the signing job gave as its output (not only the file travelling with the .dmg)
            # must be the one of the file downloaded here
            $want = $env:MACOS_DMG_SHA256
            if ($want -notmatch '^[0-9a-f]{64}$') { throw "the macOS build gave no SHA-256 output" }
            $inFile = (Get-Content dist-macos/uppwind-companion-macos.dmg.sha256).Split(' ')[0]
            if ($inFile -ne $want) { throw "uppwind-companion-macos.dmg.sha256 says $inFile, the macOS build output says $want" }
            $got = (Get-FileHash -Algorithm SHA256 dist-macos/uppwind-companion-macos.dmg).Hash.ToLowerInvariant()
            if ($want -ne $got) { throw "uppwind-companion-macos.dmg: SHA-256 $got, the macOS build gave $want" }
            Copy-Item dist-macos/uppwind-companion-macos.dmg dist/uppwind-companion-macos.dmg
            $files += 'uppwind-companion-macos.dmg'
          }
          $sums = ''
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path dist $f)).Hash.ToLowerInvariant()
            $sums += "$hash  $f`n"
          }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'dist/SHA256SUMS'), $sums)
          Get-Content dist/SHA256SUMS
          Get-ChildItem dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # the exe, the .dmg when there is one, SHA256SUMS
          subject-path: dist/*
      - name: Release notes
        env:
          RUSTC_VERSION: ${{ needs.windows.outputs.rustc }}
          UPDATE_KEYS: ${{ needs.windows.outputs.update_keys }}
          WITH_MACOS: ${{ needs.macos.result == 'success' }}
        run: |
          $rustc = $env:RUSTC_VERSION
          $sums = Get-Content dist/SHA256SUMS
          $hash = ($sums | Where-Object { $_ -like '*uppwind-companion.exe' }).Split(' ')[0]
          $repo = $env:GITHUB_REPOSITORY
          # the update keys this exe accepts (update::UPDATE_KEYS), as the Windows job read them from the exe
          $keys = @($env:UPDATE_KEYS -split ' ' | Where-Object { $_ })
          if ($keys.Count -eq 0) { throw "no update key from the Windows job" }
          $notes = @(
            "Uppwind Link companion $env:GITHUB_REF_NAME for Windows 10 (version 2004 or later) and Windows 11, 64-bit."
            ""
            "**What it is.** ``uppwind-companion.exe`` is the local program that lets Uppwind Studio (https://beta.uppwind.com/atelier) show and play the windows of the plugins hosted in Ableton Live and FL Studio (or, since 0.4.12 and in beta, host your VST 3 plugins itself, without a DAW), and bring the sound of Ableton Live or FL Studio back to the studio without a virtual cable. It listens on 127.0.0.1 only; its one connection to the internet is the update check and download from this repository's GitHub releases, when you click Check for updates or tick Update automatically (off by default). With Show on Discord turned on (off until you allow it), it hands what you play in Music on the website to the Discord app on your computer, which shows it on your profile. Double-click it: a setup window installs it for your Windows account and the DAW scripts you tick. See the README for the security model and the pairing."
            ""
            "**The Uppwind Link plugins are inside** (VST3: *Uppwind Link Return* sends the DAW's sound to the studio with any audio driver, ASIO included; *Uppwind Link Notes* plays the studio's notes in the DAW, sample-accurate). The setup window installs them in ``C:\Program Files\Common Files\VST3``, the folder FL Studio and Ableton Live read: **Windows asks once for administrator rights**, for that copy only (everything else stays in your user folder). Untick them to skip it; ``uppwind-companion.exe --install-plugins`` installs them later, and uninstalling Uppwind Link removes them."
            ""
            "**Unsigned:** Windows SmartScreen will show *More info* → *Run anyway*. Verify the file first:"
            ""
            "- SHA-256 (also in ``SHA256SUMS``): ``$hash``"
            "  - PowerShell: ``Get-FileHash uppwind-companion.exe``"
            "- Built by GitHub Actions from this tag, with an artifact attestation: ``gh attestation verify uppwind-companion.exe --repo $repo --signer-workflow $repo/.github/workflows/release.yml --source-ref $($env:GITHUB_REF)`` (the two last options make sure it was built by this release workflow, from this tag)"
            "- ``SHA256SUMS`` is signed with Uppwind's update key, kept offline (``SHA256SUMS.minisig``, minisign): ``minisign -Vm SHA256SUMS -P <key>``, with the key of the README (*Updates*). The companion checks this signature itself before it downloads an update, and refuses a release without it. Keys this version accepts: ``$($keys -join '`, `')``"
            ""
            "**Rebuild it byte for byte** (RELEASING.md, steps 4 and 5): $rustc, Visual Studio build tools of the ``windows-2025`` runner, build folder ``$env:GITHUB_WORKSPACE``, ``cargo build --release --locked`` with the ``--remap-path-prefix`` flags of RELEASING.md: first ``plugin/Cargo.toml`` and ``uwl-bundle``, then ``companion/Cargo.toml`` with ``UWL_PLUGIN_BUNDLE`` naming that bundle."
            ""
          )
          if ($env:WITH_MACOS -eq 'true') {
            $mhash = ($sums | Where-Object { $_ -like '*uppwind-companion-macos.dmg' }).Split(' ')[0]
            $notes += @(
              "**macOS** (11 or later, Apple silicon and Intel), **now with Logic Pro**: ``uppwind-companion-macos.dmg`` holds ``uppwind-companion``, ``Uppwind Link.vst3`` and ``Uppwind Link.component`` (the Audio Units, for Logic Pro), all signed with a Developer ID; the .dmg is notarized by Apple and stapled. There is no setup window on a Mac yet: everything starts from Terminal."
              ""
              "1. Open the .dmg, copy ``uppwind-companion`` where you like, and in Terminal run ``./uppwind-companion --install``: it copies itself to ``~/Library/Application Support/Uppwind Link/`` (no administrator rights; ``--autostart on`` starts it at every login)."
              "2. ``~/Library/Application\ Support/Uppwind\ Link/uppwind-companion --setup --apply`` installs the DAW scripts and the Uppwind Link plugins: the VST3 in ``~/Library/Audio/Plug-Ins/VST3``, the Audio Units in ``~/Library/Audio/Plug-Ins/Components`` (``--install-plugins``: the plugins alone; or drag them from the .dmg into those folders). Quit and reopen Logic Pro: it checks new Audio Units when it starts. On a Mac, **Uppwind Link Return** on the DAW's master is how its sound reaches the studio."
              "3. In **System Settings › Privacy & Security**, allow **Screen Recording** (on recent macOS: *Screen & System Audio Recording*) and **Accessibility** for Terminal, the program that runs the companion: the first shows your plugins' windows in the studio, the second lets the studio click and turn their knobs, and gives Logic Pro's plugin windows their names. macOS asks for the first by itself, never for the second."
              "4. Start it from Terminal: ``~/Library/Application\ Support/Uppwind\ Link/uppwind-companion``; it prints the pairing code. It shows, plays and hears nothing until you type ``arm`` in that Terminal (a copy started at login has no Terminal, so remote control stays off in it)."
              ""
              "**Logic Pro** (tried with Logic Pro 12.3.1 on macOS 26): no script, the Uppwind Link plugins do it all. Put **Uppwind Link Notes** in the MIDI FX slot of a software instrument track and **Uppwind Link Return** on the Stereo Out (type Uppwind in the slot's search field): the studio plays its notes there, sample-accurate, hears Logic's sound and follows its tempo. *Plugin windows* shows Logic's plugin windows live: a click presses the button under the pointer, dragging or the wheel turns a knob or a slider, and Logic stays in the background. A plugin whose own view shows nothing to Accessibility (several third-party plugins) gets a **Controls** button: Logic's view of all its settings, as sliders you can turn from the studio. The studio's setup guide says which macOS permission is missing."
              ""
              "**Known limits on a Mac:** no menus (a plugin's presets, *Custom*), no keyboard and no double click in Logic's plugin windows yet; the studio cannot list, add or mix Logic's tracks (no script); remote control is turned on in Terminal only (``arm``)."
              ""
              "- SHA-256 (also in ``SHA256SUMS``): ``$mhash`` (``shasum -a 256 uppwind-companion-macos.dmg``)"
              "- ``gh attestation verify uppwind-companion-macos.dmg --repo $repo --signer-workflow $repo/.github/workflows/release.yml --source-ref $($env:GITHUB_REF)``"
              ""
              "Assets: ``uppwind-companion.exe``, ``uppwind-companion-macos.dmg``, ``SHA256SUMS`` and its signature ``SHA256SUMS.minisig`` only. The DAW scripts and the Uppwind Link plugins are inside the programs (and their sources in the repository)."
            )
          } else {
            $notes += @(
              "Assets: ``uppwind-companion.exe``, ``SHA256SUMS`` and its signature ``SHA256SUMS.minisig`` only. The DAW scripts and the Uppwind Link plugins are inside the exe (and their sources in the repository)."
              ""
              "**macOS coming:** the companion builds, is signed and notarized on macOS, but it has not been tried in a real DAW yet, so there is no Mac download in this release."
            )
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'notes.md'), ($notes -join "`n") + "`n")
          Get-Content (Join-Path $env:RUNNER_TEMP 'notes.md')
      # (24 Nov, audit E2) a draft: invisible to the companions (releases/latest skips drafts) until Lucas adds
      # SHA256SUMS.minisig and publishes it (RELEASING.md, step 8); with immutable releases, files can only be added
      # to a draft
      - name: Create the draft GitHub release (the programs and SHA256SUMS; the signature is added offline)
        env:
          GH_TOKEN: ${{ github.token }}
          WITH_MACOS: ${{ needs.macos.result == 'success' }}
        run: |
          $assets = @('dist/uppwind-companion.exe')
          if ($env:WITH_MACOS -eq 'true') { $assets += 'dist/uppwind-companion-macos.dmg' }
          $assets += 'dist/SHA256SUMS'
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --title "Uppwind Link companion $env:GITHUB_REF_NAME" --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md') --verify-tag --draft
          if ($LASTEXITCODE -ne 0) { exit 1 }

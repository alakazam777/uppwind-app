# Uppwind Link -- a macOS preview, started by hand (Actions > macos-preview > Run workflow, or
# `gh workflow run macos-preview.yml`): the same signed, notarized and stapled .dmg as a release would carry
# (macos-build.yml), kept as a workflow artifact only. No GitHub release, no tag: the Mac build has to pass a test in
# a real DAW before release.yml ships it (repository variable MACOS_RELEASE=1).
name: macos-preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/macos-build.yml

# Uppwind Link -- cargo deny's rules for the companion and the plugins it carries (CI and RELEASING.md step 1):
#   cargo deny --manifest-path companion/Cargo.toml --config deny.toml check advisories bans licenses sources
#   cargo deny --manifest-path plugin/Cargo.toml --config deny.toml check advisories bans licenses sources

[graph]
# the systems the companion and the plugins are built for
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# every RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails the check
ignore = []

[licenses]
# the licences already accepted for the crates the companion and the plugins link (THIRD-PARTY-NOTICES.txt,
# plugin/THIRD-PARTY-NOTICES.txt); our own crates are GPL-3.0-or-later. ISC: nice-plug, nice-plug-core,
# nice-plug-derive and nice-log, which the plugins are built with (a permissive licence, compatible with the GPL)
allow = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "IJG",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# macOS only (wry -> dirs -> dirs-sys -> option-ext), not in the Windows exe: MPL-2.0 allows the combination with the
# GPL (its section 3.3). Its licence text is in THIRD-PARTY-NOTICES.txt (the list of the macOS-only crates).
exceptions = [
    { name = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# our path crate (../plugin/proto) has no version: not a wildcard
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

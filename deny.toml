# Uppwind Link -- cargo deny's rules for the companion (CI and RELEASING.md step 1):
#   cargo deny --manifest-path companion/Cargo.toml check --config deny.toml advisories bans licenses sources

[graph]
# the systems the companion is built for
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# every RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails the check
ignore = []

[licenses]
# the licences already accepted for the crates the companion links (THIRD-PARTY-NOTICES.txt); our own crates are
# GPL-3.0-or-later
allow = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "IJG",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# macOS only (wry -> dirs -> dirs-sys -> option-ext), not in the Windows exe: MPL-2.0 allows the combination with the
# GPL (its section 3.3). Its notice must join the Mac build's notices before the first Mac release.
exceptions = [
    { name = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# our path crate (../plugin/proto) has no version: not a wildcard
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
